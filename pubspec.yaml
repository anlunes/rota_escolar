name: rota_escolar
description: Rota Escolar - Transporte Escolar Inteligente
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Routing
  go_router: ^15.0.0
  
  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  firebase_messaging: ^15.2.5
  cloud_firestore: ^5.6.0
  
  # HTTP & API
  dio: ^5.9.0
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  
  # Storage
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.3
  
  # UI
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.15
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  
  # Connectivity
  connectivity_plus: ^6.1.2

  # File/Image Picker
  image_picker: ^1.1.2
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Linting
  flutter_lints: ^6.0.0
  custom_lint: ^0.7.2
  riverpod_lint: ^2.6.2
  
  # Code Generation
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.2
  riverpod_generator: ^2.6.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true
  
  assets:
    - assets/branding/
    - assets/icons/
    - assets/images/

